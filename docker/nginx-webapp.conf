# Single browser-facing origin for the personal server (default http://localhost:4201 via SSH tunnel).
#   /        -> upstream artcraft-webapp static build (SPA fallback to index.html)
#   /v1/     -> storyteller-web API (same origin: no CORS, host-only session cookie)
#   /media/  -> MinIO public bucket objects under media/ (anonymous GetObject only, see config/minio/)
# Media links returned by the API use MEDIA_CDN_BASE_URL (= this origin) + "/media/..." object paths.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 200m;

  # Docker's embedded DNS; resolve at request time so nginx starts even if a backend restarts.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /v1/ {
    set $api_upstream http://storyteller-web:12345;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location = /_status {
    set $api_upstream http://storyteller-web:12345;
    proxy_pass $api_upstream;
  }

  location /media/ {
    limit_except GET HEAD { deny all; }
    set $minio_upstream http://minio:9000;
    # Bucket name must match W2L_PUBLIC_DOWNLOAD_BUCKET_NAME (config/storyteller-web.env).
    rewrite ^/media/(.*)$ /artcraft-public/media/$1 break;
    proxy_pass $minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host minio:9000;
    proxy_set_header Authorization "";
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
