# ArtCraft personal-server starter (unofficial). Upstream: storytold/artcraft-services @ UPSTREAM.lock
# All published ports bind to 127.0.0.1 only. MySQL, Redis, Elasticsearch are not published at all.
name: artcraft-personal

x-storyteller-build: &storyteller-build
  context: .
  dockerfile: docker/storyteller-web.Dockerfile
  args:
    UPSTREAM_REPO: https://github.com/storytold/artcraft-services.git
    UPSTREAM_SHA: d950e57352a1b28c9296f69f8ae4eff43877de21
    BASE_IMAGE: ubuntu:jammy-20250819
    RUST_TOOLCHAIN: "1.93.0"
    DIESEL_CLI_VERSION: "2.3.14"
    # Apply patches/backend + patches/frontend at build time (ArtCraft License, see LICENSE-NOTICE.md).
    APPLY_PATCHES: ${APPLY_PATCHES:-true}

x-storyteller-env: &storyteller-env
  # Secrets / connection strings (values come from .env generated by scripts/generate-secrets.sh)
  MYSQL_URL: mysql://storyteller:${MYSQL_PASSWORD:?run scripts/generate-secrets.sh}@mysql:3306/storyteller
  REDIS_0_URL: redis://:${REDIS_PASSWORD:?run scripts/generate-secrets.sh}@redis:6379/0
  ELASTICSEARCH_URL: http://elasticsearch:9200
  COOKIE_SECRET: ${COOKIE_SECRET:?run scripts/generate-secrets.sh}
  SORT_KEY_SECRET: ${SORT_KEY_SECRET:?run scripts/generate-secrets.sh}
  ACCESS_KEY: ${MINIO_ROOT_USER:?run scripts/generate-secrets.sh}
  SECRET_KEY: ${MINIO_ROOT_PASSWORD:?run scripts/generate-secrets.sh}
  # Personal-server patch (patches/backend/0001): media links use this origin + "/media/..." paths.
  # Must be the browser-facing webapp origin (served by the `webapp` nginx). Empty = upstream CDN hosts.
  MEDIA_CDN_BASE_URL: ${WEBAPP_ORIGIN:-http://localhost:4201}

services:
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run scripts/generate-secrets.sh}
      MYSQL_DATABASE: storyteller
      MYSQL_USER: storyteller
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?run scripts/generate-secrets.sh}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g

  redis:
    image: redis:7.4.7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?run scripts/generate-secrets.sh}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run scripts/generate-secrets.sh}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  elasticsearch:
    image: elasticsearch:8.19.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Security disabled because ES is only reachable on the private compose network (no published port).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    mem_limit: 1536m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/generate-secrets.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/generate-secrets.sh}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/generate-secrets.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/generate-secrets.sh}
    volumes:
      - ./config/minio:/policies:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/artcraft-private local/artcraft-public local/artcraft-public-gc
        # Private buckets: no anonymous access at all.
        mc anonymous set none local/artcraft-private
        mc anonymous set none local/artcraft-public-gc
        # Public bucket: anonymous s3:GetObject on media/* only (no ListBucket, nothing else).
        mc anonymous set-json /policies/public-media-read.json local/artcraft-public
        mc anonymous get-json local/artcraft-public
        echo "buckets ready"
    restart: "no"

  migrate:
    build:
      <<: *storyteller-build
      target: migrate
    image: artcraft-personal/migrate:d950e573
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://storyteller:${MYSQL_PASSWORD:?run scripts/generate-secrets.sh}@mysql:3306/storyteller
      # Used only by the guarded role seed step in docker/migrate-entrypoint.sh (mysql client reads MYSQL_PWD).
      SEED_DB_HOST: mysql
      SEED_DB_USER: storyteller
      MYSQL_PWD: ${MYSQL_PASSWORD:?run scripts/generate-secrets.sh}
      # Seed upstream system roles (user/mod/admin) only if user_roles is empty. Set false to skip.
      AUTO_SEED_ROLES: ${AUTO_SEED_ROLES:-true}
    restart: "no"

  es-init:
    image: artcraft-personal/migrate:d950e573
    depends_on:
      elasticsearch:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/es-init.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    restart: "no"

  storyteller-web:
    build:
      <<: *storyteller-build
      target: runtime
    image: artcraft-personal/storyteller-web:d950e573
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      es-init:
        condition: service_completed_successfully
    env_file:
      # Tracked, non-secret settings.
      - config/storyteller-web.env
      # Gitignored. Provider/Stripe/Resend keys. Must exist (generated empty by scripts/generate-secrets.sh)
      # because upstream requires these variables to be present at boot (empty values are accepted).
      - config/providers.env
    environment:
      <<: *storyteller-env
    ports:
      - "127.0.0.1:${API_PORT:-12345}:12345"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:12345/_status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1g

  # Upstream artcraft-webapp (patched for build-time API/CDN origins) behind nginx on ONE loopback origin.
  webapp:
    build:
      <<: *storyteller-build
      target: webapp
      args:
        UPSTREAM_REPO: https://github.com/storytold/artcraft-services.git
        UPSTREAM_SHA: d950e57352a1b28c9296f69f8ae4eff43877de21
        BASE_IMAGE: ubuntu:jammy-20250819
        APPLY_PATCHES: ${APPLY_PATCHES:-true}
        VITE_API_ORIGIN: same-origin
        VITE_CDN_ORIGIN: ${WEBAPP_ORIGIN:-http://localhost:4201}
    image: artcraft-personal/webapp:d950e573
    restart: unless-stopped
    depends_on:
      storyteller-web:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-4201}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
